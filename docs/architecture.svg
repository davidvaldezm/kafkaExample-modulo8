<text x="466" y="516" class="line">UUID → clave del mensaje Kafka</text>
<text x="466" y="544" class="line">pending: Map&lt;UUID, Future&lt;String&gt;&gt;</text>
<text x="466" y="572" class="code">complete(id, value); timeout 8 s</text>
<rect x="448" y="680" width="504" height="150" rx="10" fill="#ffffff" stroke="#d7dfe3" stroke-width="1.5"/>
