<text x="466" y="1326" class="line">StringProducerFactoryConfig:</text>
<text x="466" y="1354" class="code">  producerFactory() / kafkaTemplate()</text>
<text x="466" y="1382" class="code">CorsConfig.addCorsMappings()</text>
<text x="466" y="1410" class="line">ApiExceptionHandler: 400 / 504 / 503</text>
<text x="466" y="1438" class="line">application.yml: bootstrap-servers</text>
<text x="466" y="1466" class="code">StrProducerApplication.main()</text>
<rect x="1038" y="420" width="324" height="135" rx="10" fill="#edf6f7" stroke="#6b9ba4" stroke-width="1.5"/>
<text x="1056" y="455" class="node">product-query-request</text>
<text x="1056" y="488" class="line">P0 | P1 · réplicas: 1</text>
<text x="1056" y="516" class="line">clave: UUID</text>
<text x="1056" y="544" class="line">valor: búsqueda</text>
<rect x="1038" y="680" width="324" height="135" rx="10" fill="#edf6f7" stroke="#6b9ba4" stroke-width="1.5"/>
<text x="1056" y="715" class="node">product-query-response</text>
<text x="1056" y="748" class="line">P0 | P1 · réplicas: 1</text>
<text x="1056" y="776" class="line">misma clave: UUID</text>
<text x="1056" y="804" class="line">valor: resultado JSON</text>
<rect x="1038" y="1010" width="324" height="135" rx="10" fill="#ffffff" stroke="#d7dfe3" stroke-width="1.5"/>
<text x="1056" y="1045" class="node">str-topic</text>
<text x="1056" y="1078" class="line">P0: listener1 solo registra</text>
<text x="1056" y="1106" class="line">P1: listener2 procesa</text>
<text x="1056" y="1134" class="line">P0 | P1 · réplicas: 1</text>
<rect x="1038" y="1260" width="324" height="130" rx="10" fill="#ffffff" stroke="#d7dfe3" stroke-width="1.5"/>
<text x="1056" y="1295" class="node">str-topic-response</text>
<text x="1056" y="1328" class="line">P0 | P1 · réplicas: 1</text>
<text x="1056" y="1356" class="line">clave: UUID</text>
<text x="1056" y="1384" class="code">valor: menú (texto)</text>
<rect x="1038" y="1430" width="324" height="120" rx="10" fill="#ffffff" stroke="#d7dfe3" stroke-width="1.5"/>
<text x="1056" y="1465" class="node">Infraestructura</text>
<text x="1056" y="1498" class="line">ZooKeeper :2181</text>
<text x="1056" y="1526" class="line">Kafdrop :19000</text>
<text x="1056" y="1554" class="line">docker-compose.yml</text>
<rect x="1448" y="330" width="694" height="300" rx="10" fill="#edf6f7" stroke="#6b9ba4" stroke-width="1.5"/>
<text x="1466" y="365" class="node">ProductQueryListener · NUEVO</text>
<text x="1466" y="398" class="code">@KafkaListener(topics=&quot;product-query-request&quot;)</text>
<text x="1466" y="426" class="line">grupo: product-query-workers</text>
<text x="1466" y="454" class="code">onQuery(record) → process(record)</text>
<text x="1466" y="482" class="code">ProductCatalogService.search(record.value())</text>
<text x="1466" y="510" class="code">kafka.send(&quot;product-query-response&quot;, UUID, JSON)</text>
<text x="1466" y="538" class="line">JSON: products, total, requestId, query,</text>
<text x="1466" y="566" class="line">processedAt, requestTopic, partition y offset</text>
<rect x="1448" y="700" width="694" height="140" rx="10" fill="#ffffff" stroke="#d7dfe3" stroke-width="1.5"/>
<text x="1466" y="735" class="node">ProductCatalogService</text>
<text x="1466" y="768" class="code">search(query) / normalize(text)</text>
<text x="1466" y="796" class="line">Catálogo en memoria: 6 productos, precios MXN</text>
<text x="1466" y="824" class="line">Filtro por ID, nombre o categoría; ignora acentos</text>
<rect x="1448" y="1010" width="694" height="180" rx="10" fill="#ffffff" stroke="#d7dfe3" stroke-width="1.5"/>
<text x="1466" y="1045" class="node">StrConsumerListener</text>
<text x="1466" y="1078" class="code">listener1(): group-1, asignación fija P0, log</text>
<text x="1466" y="1106" class="code">listener2(record): group-1, fija P1, responde</text>
<text x="1466" y="1134" class="code">listener3(): group-2, suscripción a todo str-topic</text>
<text x="1466" y="1162" class="line">validMessageContainerFactory para los tres</text>
<rect x="1448" y="1250" width="694" height="120" rx="10" fill="#ffffff" stroke="#d7dfe3" stroke-width="1.5"/>
<text x="1466" y="1285" class="node">OrderProcessor</text>
<text x="1466" y="1318" class="code">process(message)</text>
<text x="1466" y="1346" class="line">Genera menú vegan / vegetarian / meat / general</text>
<rect x="1448" y="1420" width="694" height="135" rx="10" fill="#ffffff" stroke="#d7dfe3" stroke-width="1.5"/>
<text x="1466" y="1455" class="node">StringConsumerConfig / application.yml</text>
<text x="1466" y="1488" class="code">consumerFactory() / validMessageContainerFactory()</text>
<text x="1466" y="1516" class="code">validMessage(): interceptor registra, NO descarta</text>
<text x="1466" y="1544" class="code">StrConsumerApplication.main(); KafkaTemplate autoconfig.</text>
