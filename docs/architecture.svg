<text x="466" y="804" class="line">grupo: product-replies-${random.uuid}</text>
<rect x="448" y="1010" width="504" height="160" rx="10" fill="#ffffff" stroke="#d7dfe3" stroke-width="1.5"/>
<text x="466" y="1045" class="node">ProducerController / StringProducerService</text>
<text x="466" y="1078" class="code">sendMenu() / sendTest() → sendMessage()</text>
