<rect x="1805" y="1206" width="93" height="24" fill="#fff"/>
<text x="1810" y="1224" class="small">process()</text>
<polyline points="1448,1155 1400,1155 1400,1320 1362,1320" fill="none" stroke="#687077" stroke-width="2.4" marker-end="url(#b)"/>
<polyline points="1038,1320 990,1320 990,868 850,868 850,830" fill="none" stroke="#687077" stroke-width="2.4" marker-end="url(#b)"/>
<rect x="780" y="872" width="201" height="24" fill="#fff"/>
<text x="785" y="890" class="small">listen() → complete()</text>
<text x="455" y="1197" class="small">Ambos producers delegan en KafkaRequestReplyService.request().</text>
<text x="48" y="1640" class="sub">Particiones ≠ réplicas: cada topic tiene dos logs independientes y una sola copia de cada log (sin tolerancia a caída del broker).</text>
<text x="48" y="1680" class="sub">topics() declara 4 × TopicBuilder.partitions(2).replicas(1). El navegador usa HTTP; no usa WebSocket ni se conecta a Kafka.</text>
<text x="48" y="1716" class="small">La clase clientes del repositorio original no participa en los flujos. test-topic es solo un ejemplo del README. Diagrama derivado del código de esta entrega.</text>
</svg>